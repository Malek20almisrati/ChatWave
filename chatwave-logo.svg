      <stop offset="1" stop-color="#25BFC2"/>
    </linearGradient>
    <linearGradient id="bubble" x1="115" y1="111" x2="320" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/>
